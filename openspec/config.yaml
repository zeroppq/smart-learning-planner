schema: spec-driven

context: |
  产品「智学规划」：华为云比赛项目，给大学生用的学习规划网页系统。
  - 形态：网页，手机与电脑浏览器均需能正常使用；单人使用，不做注册登录；数据需持久化
  - 比赛硬约束：必须覆盖AI应用全链路（数据/知识库管理、数据处理、智能体构建、推理部署、结果可视化）
  - 复杂度原则：得分链路（功能闭环、Agent能力、全链路覆盖）做全，非得分项（登录、华丽界面）从简
  - 产品负责人无编程基础：面向用户的解释与文档一律用中文通俗语言，出现术语须用一句话解释

rules:
  proposal:
    - 所有文档用中文撰写
    - 必须明确列出本次变更"不做的事"（out of scope）
    - 面向用户的说明不堆砌术语
  specs:
    - 需求以"场景 + 验收标准"方式描述，让非程序员也能对照验证
  tasks:
    - 每个任务拆分到一次会话可完成的粒度
    - 任务描述须让非程序员看懂"这一步做了什么"

operations:
  apply:
    guidance:
      - 实施中遇到需求歧义，先向用户确认再动手，不要自行猜测
  archive:
    guidance:
      - 归档时用通俗语言总结本次变更实际做了什么，同时检查开发痕迹材料（比赛码道使用深度得分项）是否完整
